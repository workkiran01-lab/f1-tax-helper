name: Uptime check

# Every day: keeps the free Supabase project from being auto-paused (the health endpoint
# makes a real Supabase REST request) and proves AI chat works end to end, using about 3,000
# of the free daily model tokens. A busy answer ("Lots of students are asking questions") is
# retried once and then only warns; anything else that is not a 200 fails the run, and
# GitHub emails the person who last edited this workflow. The logic is in
# scripts/uptime-check.mjs, which tests/uptime.test.js covers.
on:
  schedule:
    - cron: '17 15 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Site, Supabase and AI chat answer
        run: node scripts/uptime-check.mjs
